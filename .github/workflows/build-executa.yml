name: Build Multi-Platform Executa Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. 1.1.0)'
        required: false
        default: '1.1.0'
  push:
    branches:
      - main
    paths:
      - 'executas/**'
      - '.github/workflows/build-executa.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            format: tar.gz
            bin_name: sentinel-risk-scanner
          - platform: darwin-arm64
            os: macos-14
            format: tar.gz
            bin_name: sentinel-risk-scanner
          - platform: darwin-x86_64
            os: macos-14
            format: tar.gz
            bin_name: sentinel-risk-scanner
          - platform: windows-x86_64
            os: windows-latest
            format: zip
            bin_name: sentinel-risk-scanner.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build Executa Binary (darwin-x86_64)
        if: matrix.platform == 'darwin-x86_64'
        run: |
          cd executas/sentinel-risk-scanner
          uv python install cpython-3.12-macos-x86_64-none
          uv run --python cpython-3.12-macos-x86_64-none --with pyinstaller pyinstaller --onefile --clean --name sentinel-risk-scanner sentinel_risk_scanner_plugin.py
          mkdir -p release_artifacts
          tar -czvf release_artifacts/sentinel-risk-scanner-1.1.0-${{ matrix.platform }}.tar.gz -C dist sentinel-risk-scanner

      - name: Build Executa Binary (darwin-arm64 and linux-x86_64)
        if: runner.os != 'Windows' && matrix.platform != 'darwin-x86_64'
        run: |
          cd executas/sentinel-risk-scanner
          uv run --python 3.12 --with pyinstaller pyinstaller --onefile --clean --name sentinel-risk-scanner sentinel_risk_scanner_plugin.py
          mkdir -p release_artifacts
          tar -czvf release_artifacts/sentinel-risk-scanner-1.1.0-${{ matrix.platform }}.tar.gz -C dist sentinel-risk-scanner

      - name: Build Executa Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cd executas/sentinel-risk-scanner
          uv run --python 3.12 --with pyinstaller pyinstaller --onefile --clean --name sentinel-risk-scanner sentinel_risk_scanner_plugin.py
          New-Item -ItemType Directory -Force -Path release_artifacts
          Compress-Archive -Path dist\sentinel-risk-scanner.exe -DestinationPath release_artifacts\sentinel-risk-scanner-1.1.0-${{ matrix.platform }}.zip

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: executas/sentinel-risk-scanner/release_artifacts/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la all_artifacts

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0-binaries
          name: "Sentinel Risk Scanner v1.1.0 Multi-Platform Binaries"
          body: "Official multi-platform Executa binaries for Anna AI OS (Cloud Agent & Desktop)."
          files: all_artifacts/*
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
